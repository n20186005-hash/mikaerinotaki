<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>オフライン｜見帰りの滝</title>
    <meta name="theme-color" content="#183B34" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6f3;
        color: #29312e;
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
        padding: 24px;
      }
      .box {
        max-width: 460px;
        background: #fff;
        border: 1px solid rgba(24, 59, 52, 0.12);
        border-radius: 18px;
        padding: 34px 30px;
        text-align: center;
        box-shadow: 0 18px 50px -28px rgba(24, 59, 52, 0.55);
      }
      h1 { font-family: "Noto Serif JP", serif; color: #183b34; font-size: 1.5rem; margin: 0 0 10px; letter-spacing: 0.06em; }
      p { color: rgba(41, 49, 46, 0.82); font-size: 0.94rem; line-height: 1.8; margin: 0 0 18px; }
      a {
        display: inline-block;
        text-decoration: none;
        background: #183b34;
        color: #fff;
        border-radius: 999px;
        padding: 12px 24px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>オフラインです</h1>
      <p>見帰りの滝のページを読み込めませんでした。接続を確認してもう一度お試しください。キャッシュ済みのページはそのままご覧いただけます。</p>
      <a href="/">トップへ戻る</a>
    </div>
  </body>
</html>
